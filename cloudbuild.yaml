steps:
  # 1. Construir la imagen de Docker
  - name: 'gcloudsdk/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build -t $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest .

  # 2. Subir la imagen al repositorio (Artifact Registry)
  - name: 'gcloudsdk/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker push $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest

  # 3. Desplegar en Cloud Run
  - name: 'gcloudsdk/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest'
      - '--region'
      - '$_REGION'
      - '--allow-unauthenticated'
      - '--set-secrets=BOT_TOKEN=BOT_TOKEN:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest'
      - '--quiet'

substitutions:
  _REGION: europe-southwest1
  _SERVICE_NAME: bot-facturas
  _REPOSITORY: cloud-run-source-deploy

options:
  logging: CLOUD_LOGGING
