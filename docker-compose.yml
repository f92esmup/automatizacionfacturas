version: '3.8'

services:
  # ── Base de Datos PostgreSQL ─────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facturas_erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # PERSISTENCIA: Datos de Postgres en tu host
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - erp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-facturas_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Bot de Telegram ──────────────────────────────────────────
  bot_facturas:
    build: .
    container_name: erp_facturador_bot
    restart: always
    env_file:
      - .env
    volumes:
      # PERSISTENCIA DE IMÁGENES:
      # Temporales (en descarga)
      - ./temp_tickets:/app/temp_tickets
      # Procesadas (organizadas por año/mes)
      - ./facturas_procesadas:/app/facturas_procesadas
    networks:
      - erp_net
    depends_on:
      db:
        condition: service_healthy

# ── Red interna privada ────────────────────────────────────────────────────
networks:
  erp_net:
    driver: bridge
